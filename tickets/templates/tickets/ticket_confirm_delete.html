{% extends 'tickets/base.html' %}
{% block title %}Delete Ticket{% endblock %}
{% block content %}
<h2>Delete Ticket #{{ ticket.id }}?</h2>
<p>Are you sure you want to delete the ticket for <strong>{{ ticket.customer_name }}</strong> ({{ ticket.device_model }})? This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-delete">Yes, Delete</button>
    <a href="{% url 'ticket_list' %}" class="btn" style="background:#ccc;">Cancel</a>
</form>
{% endblock %}
