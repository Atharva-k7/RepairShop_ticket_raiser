{% extends 'tickets/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" class="card">
    {% csrf_token %}
    {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p style="color:#d9534f; font-size:12px;">{{ field.errors }}</p>{% endif %}
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'ticket_list' %}" class="btn" style="background:#ccc;">Cancel</a>
</form>
{% endblock %}
